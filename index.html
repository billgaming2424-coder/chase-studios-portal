<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chase Studios | Official Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #07050d;
      --card-bg: #110c1c;
      --card-hover: #171026;
      --border: #2e1065;
      --cyan: #22d3ee;
      --purple: #818cf8;
      --violet: #c084fc;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --gold: #fde047;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    
    .container { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; }

    /* Announcement Ticker */
    .ticker { background: rgba(46, 16, 101, 0.4); border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 1rem; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; font-size: 0.85rem; flex-wrap: wrap; gap: 0.5rem; }
    .ticker-tag { background: var(--cyan); color: #07050d; font-weight: 800; padding: 0.2rem 0.5rem; border-radius: 4px; text-transform: uppercase; margin-right: 0.5rem; }

    /* Navigation Bar */
    nav { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: 2.5rem; }
    .nav-brand { font-weight: 900; font-size: 1.4rem; letter-spacing: 2px; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 600; transition: color 0.2s; }
    .nav-links a:hover { color: var(--cyan); }

    /* Hero Section */
    .hero { text-align: center; margin-bottom: 3.5rem; }
    .logo-container { width: 160px; height: 160px; margin: 0 auto 1.25rem; }
    .hero h1 { font-size: 2.8rem; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 0.5rem; }
    .hero p { color: var(--cyan); font-weight: 700; letter-spacing: 3px; font-size: 1rem; text-transform: uppercase; }

    /* Layout Grids */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2.5rem; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-bottom: 2.5rem; }
    @media (max-width: 850px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    /* Card Component */
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .card-badge { display: inline-block; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; color: var(--cyan); padding: 0.25rem 0.6rem; background: rgba(34, 211, 238, 0.1); border-radius: 6px; margin-bottom: 1rem; }
    .card-badge.gold { color: var(--gold); background: rgba(253, 224, 71, 0.1); }
    .card h2 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    .card h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .card p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }

    /* Section Headers */
    .section-title { font-size: 1.5rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem
